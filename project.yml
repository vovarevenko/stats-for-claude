name: StatsForClaude

options:
  bundleIdPrefix: org.revenko
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "4DDDLR4X3X"
    CODE_SIGN_STYLE: Automatic

packages:
  StatsForClaudeKit:
    path: StatsForClaudeKit

targets:

  StatsForClaude:
    type: application
    platform: macOS
    sources:
      - path: StatsForClaude
        excludes:
          - Resources
      - path: StatsForClaude/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.revenko.stats-for-claude
        INFOPLIST_FILE: StatsForClaude/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: StatsForClaude/Resources/StatsForClaude.entitlements
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: StatsForClaudeKit
        product: StatsForClaudeKit
      - package: StatsForClaudeKit
        product: StatsForClaudeAppKit

schemes:
  StatsForClaude:
    build:
      targets:
        StatsForClaude: all
