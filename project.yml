name: StatsForClaude

options:
  bundleIdPrefix: org.revenko
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "4DDDLR4X3X"
    CODE_SIGN_STYLE: Automatic

packages:
  StatsForClaudeKit:
    path: StatsForClaudeKit

targets:

  StatsForClaude:
    type: application
    platform: macOS
    sources:
      - path: StatsForClaude
        excludes:
          - Resources
    resources:
      - path: StatsForClaude/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.revenko.stats-for-claude
        INFOPLIST_FILE: StatsForClaude/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: StatsForClaude/Resources/StatsForClaude.entitlements
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: StatsForClaudeKit

  StatsForClaudeWidget:
    type: app-extension
    platform: macOS
    sources:
      - StatsForClaudeWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.revenko.stats-for-claude.widget
        INFOPLIST_FILE: StatsForClaudeWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: StatsForClaudeWidget/StatsForClaudeWidget.entitlements
        ENABLE_APP_SANDBOX: YES
    dependencies:
      - package: StatsForClaudeKit
      - target: StatsForClaude
        embed: false

schemes:
  StatsForClaude:
    build:
      targets:
        StatsForClaude: all
      preActions:
        - name: Patch Localizable.xcstrings
          script: python3 "${SRCROOT}/scripts/add_xcstrings.py"
          settingsTarget: StatsForClaude
