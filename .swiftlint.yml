disabled_rules:
  - todo
  - trailing_comma

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - sorted_first_last
  - toggle_bool
  - unused_import
  - vertical_whitespace_closing_braces
  - redundant_nil_coalescing

excluded:
  - .build
  - DerivedData
  - StatsForClaudeKit/.build
  - StatsForClaudeKit/.swiftpm
  - StatsForClaude.xcodeproj

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

function_body_length:
  warning: 80
  error: 150

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 600
  error: 1000

identifier_name:
  min_length: 2
  excluded:
    - id
    - i
    - m
    - p
    - s
    - t
    - x
    - y
    - n
    - f
    - q
    - c
    - r

type_name:
  min_length: 3

cyclomatic_complexity:
  warning: 12

nesting:
  type_level: 3
